nodeLinker: node-modules

# Below needs Git-tracking .yarn folder.
yarnPath: .yarn/releases/yarn-4.9.4.cjs

# Re-introduce the root workspace's `postinstall` script, which Yarn 4
# deliberately skips. See the plugin file for the rationale.
plugins:
  - path: 3rd-party/automation/yarn-plugin/postinstall.ts
    spec: "yarn-plugin-postinstall"
